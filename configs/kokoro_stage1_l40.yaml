# ═══════════════════════════════════════════════════════════════════════
# TuneX — Kokoro-VN Stage 1 config cho GPU LARGE (2x L40 88GB / 3090 24GB)
# ⚠️ Khác bản n1 (3060 12GB): batch 2 → 32-64, fp16 → bf16-mixed
# Model: Kokoro-Vietnamese (82M StyleTTS2) — finetune giọng Ngọc Huyền
# ═══════════════════════════════════════════════════════════════════════
pretrained_model: "../training/kokoro_vi.pth"   # VN pretrained 3000h — BẮT BUỘC (không dùng base EN)
pretrained_model_url: "https://huggingface.co/contextboxai/Kokoro-Vietnamese/resolve/main/kokoro_vi.pth"

log_dir: "logs/kokoro-ngochuyen-88gb"

data_params:
  train_data: "../training/vi/train_list.txt"
  val_data: "../training/vi/val_list.txt"
  batch_size: 48              # ⚠️ 3060=2 | 3090 24GB: 16-24 | L40 48GB: 32-48
  num_workers: 16             # 28 cores n1 — dư sức
  # L40/3090 (Ampere+): bf16-mixed | V100/2060: fp16 (không bf16)
  precision: "bf16-mixed"
  # 3060 12GB cần accumulate 2-4 cho effective batch lớn — L40 không cần
  accumulate_grad_batches: 1

epochs_1st: 20
epochs_2nd: 20
save_freq: 2
log_freq: 50
val_freq: 1000

# Text-to-Speech (TTS) params — giữ nguyên (đã verify)
phoneme_level: 2
TMA_epoch: 2                # mask từ epoch 2 (ấm máy trước)

# Stage 2 params
lambda_diff: 1.0
diff_epoch: 0               # bật diffusion ngay từ đầu
embedding_mask_proba: 0.2

# Mixed precision (Ampere+ bf16 — L40/3090/4090/A100)
bf16: true
fp16: false

# DDP 2 GPU (nếu dùng cả 2 L40) — accelerate config riêng: --num_processes 2
# Batch hiệu quả = batch_size × num_gpus = 48 × 2 = 96
