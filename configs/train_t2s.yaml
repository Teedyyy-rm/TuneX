# ═══════════════════════════════════════════════════════════════════════
# TuneX — T2S Training Config (Confucius4 finetune giọng mới)
# Stage 1: text → semantic tokens (LLM GPT-2 24L)
# ═══════════════════════════════════════════════════════════════════════
log_dir: ./logs/t2s_train

seed: 42

paths:
  tokenizer_path: ./checkpoints
  w2v_bert_path: ./pretrained/w2v-bert-2.0
  w2v_stat: ./checkpoints/wav2vec2bert_stats.pt
  t2s_checkpoint: ./checkpoints/t2s_model.safetensors

# ===================== Data Configuration =====================
data:
  train_data_path:
    - ./data/processed/train.tsv
  val_data_path:
    - ./data/processed/val.tsv
  batch_size: 8              # 3090 24GB — batch 16 OOM (seq 1520)
  num_workers: 8
  sample_rate: 16000

# ===================== Model Configuration (T2S) =====================
t2s_model:
  num_layers: 24
  model_dim: 1280
  num_heads: 20
  max_text_seq_lens: 520
  max_semantic_seq_lens: 1520
  vocab_size: 32000
  semantic_vocab_size: 8194
  text_embedding_dim: 4096
  speaker_embedding_dim: 1024
  start_semantic_token: 8192
  stop_semantic_token: 8193

# ===================== Training Configuration =====================
training:
  precision: bf16-mixed        # RTX 3090 (Ampere) — bf16 tensor core
  epochs: 20                 # finetune 1 giọng: 10-20 epochs đủ
  gradient_clip: 1.0
  accumulate_grad_batches: 2
  val_check_interval: 1000
  limit_val_batches: 10
  save_every_n_steps: 620   # = 1 epoch (optimizer steps — accumulate 2: 1239/2)
  log_every_n_steps: 10
  benchmark: true

# ===================== Optimizer Configuration =====================
optimizer:
  optimizer_type: adamw
  learning_rate: 5.0e-5      # full finetune dataset nhỏ: 2e-5~5e-5 — chống catastrophic forgetting
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8

# ===================== Learning Rate Scheduler =====================
scheduler:
  scheduler_type: cosine
  num_warmup_steps: 1000
  num_training_steps: 12390  # 620 opt steps x 20 epochs
